<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">How an answer engine turns a question into a cited answer</title><desc id="d">Flow diagram showing a buyer question going to an answer engine, which retrieves sources and returns a synthesized answer that cites a brand</desc>
<defs>
<radialGradient id="glow" cx="75%" cy="45%" r="60%"><stop offset="0" stop-color="#10b261" stop-opacity=".28"/><stop offset="1" stop-color="#10b261" stop-opacity="0"/></radialGradient>
<linearGradient id="grn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f57b"/><stop offset="1" stop-color="#10b261"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#10b261"/></marker>
</defs>
<rect width="1200" height="560" fill="#060e0e"/>
<g stroke="#1f3638" stroke-width="1" opacity=".55"><path d="M0 0V560" /><path d="M64 0V560" /><path d="M128 0V560" /><path d="M192 0V560" /><path d="M256 0V560" /><path d="M320 0V560" /><path d="M384 0V560" /><path d="M448 0V560" /><path d="M512 0V560" /><path d="M576 0V560" /><path d="M640 0V560" /><path d="M704 0V560" /><path d="M768 0V560" /><path d="M832 0V560" /><path d="M896 0V560" /><path d="M960 0V560" /><path d="M1024 0V560" /><path d="M1088 0V560" /><path d="M1152 0V560" /><path d="M0 0H1200" /><path d="M0 64H1200" /><path d="M0 128H1200" /><path d="M0 192H1200" /><path d="M0 256H1200" /><path d="M0 320H1200" /><path d="M0 384H1200" /><path d="M0 448H1200" /><path d="M0 512H1200" /></g>
<rect width="1200" height="560" fill="url(#glow)"/>
<rect x="40" y="190" width="250" height="180" rx="14" fill="#0b1919" stroke="#11474a" stroke-width="1.5"/><text x="165" y="255" font-family="Instrument Sans, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f6f9f7" text-anchor="middle" opacity="1">Buyer asks</text><text x="165" y="300" font-family="Instrument Sans, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8fa5a0" text-anchor="middle" opacity="1">“Best tool for a seed-st</text><text x="165" y="326" font-family="Instrument Sans, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8fa5a0" text-anchor="middle" opacity="1">age team?”</text><path d="M292 280H326" stroke="#10b261" stroke-width="3.5" marker-end="url(#arr)"/><rect x="330" y="190" width="250" height="180" rx="14" fill="#0b1919" stroke="#11474a" stroke-width="1.5"/><text x="455" y="255" font-family="Instrument Sans, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f6f9f7" text-anchor="middle" opacity="1">Answer engine</text><text x="455" y="300" font-family="Instrument Sans, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8fa5a0" text-anchor="middle" opacity="1">Reads and ranks sources</text><path d="M582 280H616" stroke="#10b261" stroke-width="3.5" marker-end="url(#arr)"/><rect x="620" y="190" width="250" height="180" rx="14" fill="#0b1919" stroke="#11474a" stroke-width="1.5"/><text x="745" y="255" font-family="Instrument Sans, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f6f9f7" text-anchor="middle" opacity="1">Sources</text><text x="745" y="300" font-family="Instrument Sans, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8fa5a0" text-anchor="middle" opacity="1">Pages, reviews, mentions</text><path d="M872 280H906" stroke="#10b261" stroke-width="3.5" marker-end="url(#arr)"/><rect x="910" y="190" width="250" height="180" rx="14" fill="#0c3126" stroke="#00f57b" stroke-width="3"/><text x="1035" y="255" font-family="Instrument Sans, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f6f9f7" text-anchor="middle" opacity="1">Cited answer</text><text x="1035" y="300" font-family="Instrument Sans, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8fa5a0" text-anchor="middle" opacity="1">Your brand is named</text>
</svg>
