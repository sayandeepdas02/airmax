<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">SEO returns a list of links, AEO returns one cited answer</title><desc id="d">Diagram comparing SEO, which returns ten blue links to a user, with AEO, which returns one synthesized answer citing three sources</desc>
